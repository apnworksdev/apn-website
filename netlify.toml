[build]
  # The Netlify adapter writes the server function under astro-app/.
  # Netlify reads that function from .netlify/v1 at the repository root.
  command = "npm run build --workspace=astro-app && mkdir -p .netlify/v1 && cp -R astro-app/.netlify/v1/. .netlify/v1/"
  publish = "astro-app/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
